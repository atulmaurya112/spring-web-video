spring.application.name=video-stream

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/video_streaming}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

video.storage.path=${VIDEO_STORAGE_PATH:videos}
ffmpeg.path=${FFMPEG_PATH:C:/Users/atulm/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-9.0.2-full_build/bin/ffmpeg.exe}

# Tune to your machine and expected concurrent uploads.
video.processing.timeout=PT2H
